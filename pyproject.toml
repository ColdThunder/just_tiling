[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "just_tiling"
version = "0.1.0"
description = "Tile scheduling for the JUST galaxy/galaxy cluster survey"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4",
    "matplotlib>=3.3.5",
    "healpy>=1.16.5",
    "astropy>=5.2.2",
    "scipy>=1.10.0",
    "joblib>=1.2.0",
]

[tool.setuptools]
package-dir = {"" = "py"}

[tool.setuptools.packages.find]
where = ["py"]
namespaces = true
